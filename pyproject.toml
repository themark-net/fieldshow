[project]
name = "fieldshow"
version = "0.1.0"
description = "Agent glue for marching-band music, drill, and show design."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "themark-net"}]
dependencies = [
  "music21>=9",
  "jsonschema>=4",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fieldshow = "fieldshow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldshow = ["data/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
