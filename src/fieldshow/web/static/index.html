<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14120e;
      --text: #f4efe4;
      --muted: #a39886;
      --accent: #e8a838;
      --line: #3a3428;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 "Iowan Old Style", Palatino, Georgia, serif;
    }
    header, main { padding: 1rem 1.25rem; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    h1 { font-size: 1.6rem; margin: 0; font-weight: 600; }
    h1 span { color: var(--accent); }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(16rem, 1fr); gap: 1rem; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    svg { width: 100%; height: auto; background: #1c1914; border: 1px solid var(--line); }
    .panel { border: 1px solid var(--line); padding: 0.8rem 1rem; }
    .muted { color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0.4rem 0 0; }
    li { display: flex; justify-content: space-between; gap: 0.5rem; font-variant-numeric: tabular-nums; }
    button { background: transparent; color: var(--text); border: 1px solid var(--accent); padding: 0.3rem 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1><span>Fieldshow</span> {{title}}</h1>
    <p class="muted" id="meta"></p>
  </header>
  <main>
    <div class="layout">
      <div>
        <svg id="field" viewBox="-100 -6 200 100" role="img" aria-label="Football field"></svg>
        <label class="muted" for="scrub">Count</label>
        <input id="scrub" type="range" min="0" max="8" value="0" step="0.25">
      </div>
      <div class="panel">
        <p id="design"></p>
        <h2 class="muted">Parts</h2>
        <ul id="parts"></ul>
      </div>
    </div>
  </main>
  <script>
    const field = document.getElementById("field");
    const ns = "http://www.w3.org/2000/svg";
    const BACK = 256 / 3;

    function el(name, attrs) {
      const node = document.createElementNS(ns, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    }

    function sy(y) { return BACK - y; }

    function drawField() {
      field.appendChild(el("rect", { x: -96, y: sy(BACK), width: 192, height: BACK, fill: "#243024", stroke: "#c8c0ae" }));
      for (let x = -80; x <= 80; x += 8) {
        field.appendChild(el("line", { x1: x, y1: sy(0), x2: x, y2: sy(BACK), stroke: "#efe8d8", "stroke-width": x % 40 === 0 ? 0.35 : 0.12 }));
      }
      for (const y of [0, 32, 160 / 3, BACK]) {
        field.appendChild(el("line", { x1: -80, y1: sy(y), x2: 80, y2: sy(y), stroke: "#efe8d8", "stroke-width": 0.2 }));
      }
    }

    function colorFor(section, sections, palette) {
      const index = Math.max(0, sections.indexOf(section));
      return palette[index % palette.length];
    }

    async function load() {
      const show = await (await fetch("/api/show")).json();
      const last = (show.sets.length - 1) * show.counts_per_set;
      const scrub = document.getElementById("scrub");
      scrub.max = String(last);
      document.getElementById("meta").textContent = show.tempo + " bpm · " + show.key;
      const design = show.design || {};
      document.getElementById("design").textContent =
        (design.uniform || "") + (design.flag ? " · " + design.flag : "");
      const parts = document.getElementById("parts");
      parts.replaceChildren();
      for (const [name, notes] of Object.entries(show.parts || {})) {
        const item = document.createElement("li");
        item.textContent = name.replaceAll("_", " ") + "  " + notes.map((note) => note || "·").join(" ");
        parts.appendChild(item);
      }
      drawField();
      async function paint() {
        const beat = Number(scrub.value);
        const frame = await (await fetch("/api/frame?beat=" + beat)).json();
        field.querySelectorAll("circle").forEach((node) => node.remove());
        const sections = [...new Set(frame.positions.map((dot) => dot.section))];
        const palette = (show.design && show.design.palette) || ["#e8a838"];
        for (const dot of frame.positions) {
          field.appendChild(el("circle", {
            cx: dot.x, cy: sy(dot.y), r: 1.15,
            fill: colorFor(dot.section, sections, palette)
          }));
          const label = el("text", { x: dot.x + 1.2, y: sy(dot.y) + 0.4, fill: "#f4efe4", "font-size": 1.4 });
          label.textContent = dot.label;
          field.appendChild(label);
        }
      }
      scrub.addEventListener("input", paint);
      await paint();
    }

    drawField();
    load();
  </script>
</body>
</html>
